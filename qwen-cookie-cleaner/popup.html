<!DOCTYPE html>
<html>
<head>
  <title>Qwen Cookie Cleaner</title>
  <style>
    body {
      width: 250px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }
    p {
      font-size: 14px;
      margin-bottom: 15px;
      color: #666;
      line-height: 1.4;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 15px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Qwen Cookie Cleaner</h1>
  <p>Click the button below to clear all cookies from chat.qwen.ai</p>
  <button id="clearCookies">Clear Qwen Cookies Now</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
